# Runs the quality gate on every push and pull request, and keeps the built
# ait.exe as a downloadable artifact of the run (for 30 days).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # Dependencies come from vendor/ (see .cargo/config.toml): no network.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: Keep ait.exe as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ait-windows-x64
          path: |
            target/release/ait.exe
            tools/issue-tracker/default.cfg
          retention-days: 30
