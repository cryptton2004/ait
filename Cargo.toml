[package]
name = "ait"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agent-first local issue tracker backed by SQLite"
license = "MIT"

[[bin]]
name = "ait"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
