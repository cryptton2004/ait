# ait configuration: plain `key = value`, `#` starts a comment.
# Relative paths are relative to this file's folder.
# ait reads this file when it sits next to ait.exe (or via --config / AIT_CONFIG).

# Database file. `auto` = <git-common-dir>/ait/tracker.db of the repository
# you run ait in, shared by all its worktrees and never committed.
db = auto

# Allowed id prefixes (comma separated). Empty = any 2-5 capital letters.
prefixes =

# Claim lease length in minutes. Any ait call by the claimant renews a live
# lease; an expired one stays expired until it is claimed again.
lease_minutes = 60

# Daily automatic backups (VACUUM INTO). `auto` = a `backups` folder next to
# the database. backup_keep = 0 turns automatic backups off.
backup_dir = auto
backup_keep = 14

# Owner-only approvals file. Not set = approvals are not used and every ready
# issue can be claimed. Once set, a missing file approves nothing.
# `git:<branch>:<path>` reads the file as committed on that branch of the
# repository (below), so an uncommitted edit has no effect. See
# approvals.example.json.
# approvals = approvals.json
# approvals = git:main:docs/planning/approvals.json

# The repository whose history `ait check --git` and `git:` sources read.
# Empty = the repository that holds the database.
# repo = ../..

# Agent tiers: `--agent <tier>` on an issue recommends a tier; show, next and
# claim also return the model it maps to (agent_model).
agent.light = haiku
agent.standard = sonnet
agent.deep = opus

# Port for `ait serve` (always bound to 127.0.0.1).
port = 7777

# Used by `ait check --git`: completed work is merged into this branch by a
# merge commit whose last paragraph has a trailer line such as
# `Issue-ID: CORE-1-00` (one id per line). Only first-parent merges count.
main_branch = main
trailer = Issue-ID

# Ids that were done before ait tracked merges (one per line, `#` comments),
# so check --git does not flag them. A path or `git:<branch>:<path>`.
# git_baseline = git:main:scripts/agent/backlog-done-baseline.txt
