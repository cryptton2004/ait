<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ait-token" content="__AIT_TOKEN__">
<meta name="ait-writable" content="__AIT_WRITABLE__">
<title>ait board</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
  --accent: #2f6fde; --ok: #1f8a4c; --warn: #b26b00; --bad: #c4372f; --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #98a2b3; --line: #2a313d;
    --accent: #6b9cff; --ok: #4cc38a; --warn: #f0b45a; --bad: #ff7b72; --chip: #252c38;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
#summary { color: var(--muted); }
#nextup { font-size: 13px; overflow-wrap: anywhere; }
#nextup b { color: var(--accent); cursor: pointer; }
#live { margin-left: auto; color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
#columns { display: grid; grid-template-columns: repeat(7, minmax(165px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 4px; min-width: 0; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.col.over { outline: 2px dashed var(--accent); }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.col h2 .n { color: var(--muted); }
.col h2 .n.full { color: var(--bad); font-weight: 600; }
.col[data-col=in_progress] h2 { color: var(--accent); }
.col[data-col=in_review] h2 { color: var(--accent); }
.col[data-col=waiting] h2 { color: var(--warn); }
.col[data-col=done] h2 { color: var(--ok); }
.col[data-col=released] h2 { color: var(--ok); }
.col h2 .tog { font-size: 11px; padding: 0 6px; text-transform: none; letter-spacing: 0; }
.col h2 .tog.on { background: var(--bad); border-color: var(--bad); color: #fff; }
.card.stale { border-color: var(--bad); }
.card .st { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--bad); }
.cards { padding: 8px; display: grid; gap: 8px; max-height: 70vh; overflow-y: auto; min-height: 48px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 8px; cursor: pointer; background: var(--bg); }
.card:hover, .card:focus { border-color: var(--accent); outline: none; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.drop { border-top: 3px solid var(--accent); }
.card.dragging { opacity: .4; }
.card .id { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.card .t { margin-top: 2px; overflow-wrap: anywhere; }
.card .m { margin-top: 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.card .id .p { margin-left: 6px; color: var(--accent); }
.card .id .p.P0, .card .id .p.P1 { color: var(--bad); font-weight: 600; }
.card .ty { margin-left: 6px; font-size: 11px; text-transform: uppercase; color: var(--warn); }
.card .nx { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--ok); }
.empty { color: var(--muted); font-size: 12px; padding: 4px; }
aside { display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0 0 8px; }
.panel h3 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; font-size: 12px; }
#feed li { border-bottom: 1px solid var(--line); padding-bottom: 6px; overflow-wrap: anywhere; }
.w { color: var(--muted); }
#detail pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; max-height: 40vh; overflow-y: auto; }
.chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; margin: 2px 4px 2px 0; }
#nextlist ol { margin: 0; padding-left: 22px; font-size: 13px; }
#nextlist li { cursor: pointer; overflow-wrap: anywhere; margin-bottom: 3px; }
#roadmap { max-height: 40vh; overflow-y: auto; }
#roadmap .item { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; overflow-wrap: anywhere; }
#roadmap .item:last-child { border-bottom: 0; }
#roadmap .k { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }
#roadmap .bar { height: 6px; background: var(--chip); border-radius: 3px; margin-top: 4px; overflow: hidden; }
#roadmap .bar span { display: block; height: 100%; background: var(--ok); }
#roadmap .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
button { font: inherit; background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
.form { display: grid; grid-template-columns: 90px 1fr; gap: 6px 8px; align-items: center; font-size: 13px; }
.form label { color: var(--muted); }
.form .full { grid-column: 1 / -1; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; width: 100%; min-width: 0; }
textarea { min-height: 140px; font: 12px ui-monospace, Consolas, monospace; resize: vertical; }
.crit { list-style: none; margin: 4px 0 8px; padding: 0; font-size: 13px; }
.crit li { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; overflow-wrap: anywhere; }
.crit input { width: auto; margin-top: 3px; }
.crit .done { color: var(--muted); text-decoration: line-through; }
#stats table { width: 100%; border-collapse: collapse; font-size: 12px; }
#stats th, #stats td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
#stats th:first-child, #stats td:first-child { text-align: left; }
#stats th { color: var(--muted); font-weight: 500; }
#stats .slow { color: var(--bad); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { font-size: 15px; margin: 0 0 10px; }
#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,.18); z-index: 10; overflow-wrap: anywhere; }
#toast.err { border-left-color: var(--bad); }
#toast > div:first-child { white-space: pre-line; }
#toast .code { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
input.bad, select.bad, textarea.bad { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.formerr { grid-column: 1 / -1; border: 1px solid var(--bad); border-left: 4px solid var(--bad); border-radius: 6px; padding: 6px 8px; margin: 8px 0; white-space: pre-line; overflow-wrap: anywhere; font-size: 13px; }
.formerr .code { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>ait board</h1>
  <span id="summary">loading…</span>
  <span id="nextup"></span>
  <button id="newbtn" class="primary" hidden>+ New issue</button>
  <span id="live"></span>
</header>
<main>
  <section id="columns" aria-label="Board columns"></section>
  <aside>
    <div class="panel" id="detail" hidden></div>
    <div class="panel" id="nextlist"><h2>Next up</h2><div id="nextbody" class="w">loading…</div></div>
    <div class="panel" id="statsPanel"><h2>Flow: time in each column <select id="statsWindow" aria-label="time window" style="width:auto;font-size:12px"><option value="7d">7 days</option><option value="30d" selected>30 days</option><option value="">all time</option></select></h2><div id="stats" class="w">loading…</div></div>
    <div class="panel" id="roadmapPanel" hidden><h2>Roadmap</h2><div id="roadmap"></div></div>
    <div class="panel"><h2>Activity</h2><ul id="feed"></ul></div>
  </aside>
</main>

<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<div id="toast" hidden></div>

<script>
"use strict";
// All tracker text is untrusted: it is only ever inserted with textContent
// or as form values, never as HTML.
let TOKEN = document.querySelector('meta[name="ait-token"]').content;
const WRITABLE = document.querySelector('meta[name="ait-writable"]').content === "true" && /^[0-9a-f]{32}$/.test(TOKEN);
// Left to right: the way work flows.
const COLS = [
  ["backlog", "Backlog"], ["ready", "Ready"], ["waiting", "Waiting"],
  ["in_progress", "In progress"], ["in_review", "In review"], ["done", "Done"], ["released", "Released"]
];
const STATES = [
  ["idea", "idea: not shaped yet"], ["planned", "planned: shaped, later / deferred"],
  ["ready", "ready: can be built now"], ["blocked", "blocked: waiting on something (reason)"],
  ["decision", "decision: needs the owner (reason)"], ["dropped", "dropped: won't do (reason)"],
  ["in_review", "in_review: built, waiting for its reviews"]
];
const NEEDS_REASON = ["blocked", "decision", "dropped"];
const TYPES = ["task", "review", "feature", "milestone", "release"];
const FINISHED = ["done", "released"];
const PRIORITIES = ["P0", "P1", "P2", "P3", "P4"];
const EFFORTS = ["", "low", "medium", "high", "xhigh", "max"];
let wip = {}, agentTiers = {}, head = -1, lastFull = 0, issues = [], nextIds = [], selected = null, dragId = null, staleOnly = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
async function get(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
function ago(iso) {
  if (!iso) return "";
  const d = (Date.parse(iso) - Date.now()) / 1000, a = Math.abs(d);
  const s = a < 60 ? Math.round(a) + "s" : a < 3600 ? Math.round(a / 60) + "m" : a < 86400 ? Math.round(a / 3600) + "h" : Math.round(a / 86400) + "d";
  return d >= 0 ? "in " + s : s + " ago";
}

// ---------------------------------------------------------------- writes
// Every write runs an ait command on the server, with the same checks as
// the command line. Errors come back in the CLI's format.
class AitError extends Error {
  constructor(e) { super(e.message || "error"); this.code = e.code || "ERROR"; }
}
// `ait serve` makes a new token on every start. If the server was restarted
// while this page stayed open, read the new token from the page once and
// retry, instead of refusing every change until a reload.
async function freshToken() {
  try {
    const page = await (await fetch("/", { cache: "no-store" })).text();
    const m = page.match(/name="ait-token" content="([0-9a-f]{32})"/);
    return m ? m[1] : null;
  } catch (e) { return null; }
}
async function run(args, retried) {
  const r = await fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Ait-Token": TOKEN },
    body: JSON.stringify({ args })
  });
  let v = {};
  try { v = await r.json(); } catch (e) { /* not JSON */ }
  if (r.status === 403 && !retried && v.error && /token/.test(v.error.message || "")) {
    const t = await freshToken();
    if (t && t !== TOKEN) { TOKEN = t; return run(args, true); }
    throw new AitError({ code: v.error.code, message: "The dashboard server was restarted or is read-only now. Reload the page." });
  }
  if (!r.ok || v.error) throw new AitError(v.error || { message: "HTTP " + r.status });
  return v.result;
}
let toastTimer = null;
function toast(msg, isErr, extra) {
  const t = document.getElementById("toast");
  t.replaceChildren();
  t.className = isErr ? "err" : "";
  t.append(el("div", null, msg));
  if (extra) t.append(extra);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isErr ? 15000 : 4000);
}
// The CLI asks for --force where the owner may override a gate (someone
// else's claim, closing without a claim, reopening done work). The
// dashboard shows the refusal and offers the same override explicitly.
function canForce(err, args) {
  return !args.includes("--force") && (["NOT_CLAIMED", "NOT_SHIPPABLE", "REVIEWS_OPEN"].includes(err.code) || /--force/.test(err.message));
}
async function act(args, okMsg, after) {
  try {
    const res = await run(args);
    toast(okMsg || ("ait " + args[0] + " done"), false);
    await refresh();
    if (after) after(res);
    return res;
  } catch (e) {
    const box = el("div");
    box.append(el("div", "code", e.code));
    if (canForce(e, args)) {
      const b = el("button", "danger", "Override (--force)");
      b.addEventListener("click", () => { document.getElementById("toast").hidden = true; act(args.concat(["--force"]), okMsg, after); });
      box.append(el("div", "w", "The command line asks for --force here. Only override if you mean to."), b);
    }
    toast(e.message, true, box);
    await refresh();
    return null;
  }
}

// ---------------------------------------------------------------- board
function card(i) {
  const c = el("div", "card" + (i.id === selected ? " sel" : "") + (i.stale ? " stale" : ""));
  c.tabIndex = 0;
  c.dataset.id = i.id;
  const idl = el("div", "id", i.id);
  if (i.priority && i.priority !== "P2") idl.append(el("span", "p " + i.priority, i.priority));
  if (i.type && i.type !== "task") idl.append(el("span", "ty", i.type));
  const pos = nextIds.indexOf(i.id);
  if (pos === 0) idl.append(el("span", "nx", "NEXT"));
  else if (pos > 0) idl.append(el("span", "nx", "#" + (pos + 1)));
  if (i.stale) idl.append(el("span", "st", "STALE"));
  c.append(idl, el("div", "t", i.title));
  let meta = "";
  if (i.column === "in_progress") meta = i.session + (i.stale ? " · lease ended " : " · lease ") + ago(i.lease_until);
  else if (i.column === "waiting") meta = i.wait || (i.state + (i.reason ? ": " + i.reason : ""));
  else if (i.column === "done") meta = "done " + ago(i.done_at);
  else if (i.column === "released") meta = "released " + ago(i.released_at);
  else if (i.column === "backlog") meta = i.wait || i.state;
  else if (i.column === "ready" && i.wait) meta = i.wait;
  else if (i.column === "in_review") meta = "in review" + (i.reason ? ": " + i.reason : "");
  if (i.agent && !FINISHED.includes(i.column)) meta = (meta ? meta + " · " : "") + "agent " + i.agent;
  if (meta) c.append(el("div", "m", meta));
  const open = () => showDetail(i.id);
  c.addEventListener("click", open);
  c.addEventListener("keydown", e => { if (e.key === "Enter") open(); });
  if (WRITABLE && i.column !== "released") {
    c.draggable = true;
    c.addEventListener("dragstart", e => { dragId = i.id; c.classList.add("dragging"); e.dataTransfer.setData("text/plain", i.id); e.dataTransfer.effectAllowed = "move"; });
    c.addEventListener("dragend", () => { dragId = null; c.classList.remove("dragging"); });
  }
  if (WRITABLE) {
    c.addEventListener("dragover", e => { if (dragId && dragId !== i.id && i.column !== "done") { e.preventDefault(); e.stopPropagation(); c.classList.add("drop"); } });
    c.addEventListener("dragleave", () => c.classList.remove("drop"));
    c.addEventListener("drop", e => { e.preventDefault(); e.stopPropagation(); c.classList.remove("drop"); const id = dragId; dragId = null; if (id && id !== i.id && i.column !== "done") rankBefore(id, i); });
  }
  return c;
}
// Drop on a card: rank the dragged issue just before it. Cards are sorted
// by priority, then rank, so a different priority is changed too.
async function rankBefore(id, target) {
  const me = issues.find(x => x.id === id);
  if (!me) return;
  if (me.priority !== target.priority) {
    const ok = await act(["edit", id, "--priority", target.priority], id + " priority " + me.priority + " → " + target.priority);
    if (!ok) return;
  }
  await act(["move", id, "--before", target.id], id + " now ranks before " + target.id);
}
// Drop on a column: change the state, asking for what the command needs.
function dropOnColumn(id, col) {
  const me = issues.find(x => x.id === id);
  if (!me || me.column === col) return;
  if (col === "ready") act(["state", id, "ready"], id + " is ready");
  else if (col === "backlog") stateDialog(me, "planned");
  else if (col === "waiting") stateDialog(me, "blocked");
  else if (col === "in_review") act(["state", id, "in_review"], id + " is in review");
  else if (col === "done") doneDialog(me);
  else if (col === "released") shipDialog(me);
  else toast("Claims are made by agents (ait claim / ait next --claim), not from the dashboard.", true);
}
function renderColumns() {
  const root = document.getElementById("columns");
  root.replaceChildren();
  for (const [key, label] of COLS) {
    let items = issues.filter(i => i.column === key);
    if (key === "done") items = items.sort((a, b) => (b.done_at || "").localeCompare(a.done_at || "")).slice(0, 30);
    if (key === "released") items = items.sort((a, b) => (b.released_at || "").localeCompare(a.released_at || "")).slice(0, 30);
    const stale = items.filter(i => i.stale).length;
    if (key === "in_progress" && staleOnly) items = items.filter(i => i.stale);
    const col = el("div", "col");
    col.dataset.col = key;
    const h = el("h2", null, label);
    if (key === "in_progress" && stale) {
      const tog = el("button", "tog" + (staleOnly ? " on" : ""), stale + " stale");
      tog.title = "show only stale claims (lease ended, nobody took over)";
      tog.addEventListener("click", e => { e.stopPropagation(); staleOnly = !staleOnly; renderColumns(); });
      h.append(tog);
    }
    const limit = wip[key];
    if (limit) {
      const live = issues.filter(i => i.column === key && !i.stale).length;
      const n = el("span", "n" + (live >= limit ? " full" : ""), live + " / " + limit);
      n.title = "WIP limit (wip." + key + " in default.cfg); stale claims do not count";
      h.append(n);
    } else h.append(el("span", "n", items.length));
    const cards = el("div", "cards");
    if (!items.length) cards.append(el("div", "empty", "nothing here"));
    for (const i of items) cards.append(card(i));
    col.append(h, cards);
    if (WRITABLE && key !== "in_progress") {
      col.addEventListener("dragover", e => { if (dragId) { e.preventDefault(); col.classList.add("over"); } });
      col.addEventListener("dragleave", e => { if (!col.contains(e.relatedTarget)) col.classList.remove("over"); });
      col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); const id = dragId; dragId = null; if (id) dropOnColumn(id, key); });
    }
    root.append(col);
  }
}
function renderFeed(events) {
  const ul = document.getElementById("feed");
  ul.replaceChildren();
  for (const e of events.slice().reverse()) {
    const li = el("li");
    li.append(el("span", "w", ago(e.at) + " · " + (e.session || "-") + " · "), el("span", null, (e.issue || "") + " " + e.action));
    const d = e.details || {};
    const extra = d.summary || d.title || d.reason || (d.to ? d.from + " → " + d.to : "");
    if (extra) li.append(el("div", "w", extra));
    ul.append(li);
  }
  if (!events.length) ul.append(el("li", "w", "no activity yet"));
}
function renderNext(v) {
  nextIds = (v.build || []).map(x => x.id);
  const top = (v.build || [])[0];
  const nu = document.getElementById("nextup");
  nu.replaceChildren();
  if (top) {
    nu.append(el("span", "w", "Next: "));
    const b = el("b", null, top.id);
    b.addEventListener("click", () => showDetail(top.id));
    nu.append(b, el("span", null, " " + top.title.slice(0, 70) + (top.title.length > 70 ? "…" : "")));
  } else nu.append(el("span", "w", "Next: nothing is ready"));
  const body = document.getElementById("nextbody");
  body.replaceChildren();
  body.className = "";
  const list = (items, title) => {
    body.append(el("h3", null, title));
    if (!items.length) { body.append(el("div", "w", "nothing")); return; }
    const ol = el("ol");
    for (const x of items) {
      const li = el("li");
      li.append(el("span", "w", x.id + " " + x.priority + (x.agent ? " · " + x.agent : "") + " · "), el("span", null, x.title));
      li.addEventListener("click", () => showDetail(x.id));
      ol.append(li);
    }
    body.append(ol);
  };
  list(v.build || [], "ait next (build)");
  list(v.frame || [], "ait next --frame");
}
function hours(h) {
  if (h === null || h === undefined) return "–";
  return h >= 48 ? (h / 24).toFixed(1) + "d" : h.toFixed(1) + "h";
}
function renderStats(v) {
  const box = document.getElementById("stats");
  box.replaceChildren();
  box.className = "";
  const t = el("table");
  const hr = el("tr");
  for (const h of ["column", "passed", "median", "p90", "now", "oldest"]) hr.append(el("th", null, h));
  t.append(hr);
  for (const [key, label] of COLS) {
    const x = v.columns[key] || {};
    const tr = el("tr");
    const oldest = el("td", null, hours(x.now_max_hours));
    // Flag an item that has waited longer than 90% of past stays.
    if (x.p90_hours !== null && x.now_max_hours !== null && x.now_max_hours > x.p90_hours && !FINISHED.includes(key)) oldest.className = "slow";
    tr.append(el("td", null, label), el("td", null, x.count || 0), el("td", null, hours(x.median_hours)), el("td", null, hours(x.p90_hours)), el("td", null, x.now || 0), oldest);
    t.append(tr);
  }
  box.append(t);
  const line = (k, label) => {
    const x = v[k];
    box.append(el("div", "w", label + ": " + x.count + " issues, median " + hours(x.median_hours) + ", p90 " + hours(x.p90_hours)));
  };
  line("cycle_time", "Cycle time (first claim → done)");
  line("lead_time", "Lead time (added → done)");
}
function rollupText(r) {
  let t = r.done + "/" + r.total + " done (" + r.percent + "%)";
  if (r.in_progress) t += ", " + r.in_progress + " in progress";
  if (r.next) t += ", next " + r.next;
  if ((r.decisions || []).length) t += ", decisions: " + r.decisions.join(" ");
  if ((r.blocked || []).length) t += ", blocked: " + r.blocked.join(" ");
  return t;
}
function renderRoadmap(v) {
  const root = document.getElementById("roadmap");
  root.replaceChildren();
  const all = [].concat(v.releases || [], v.milestones || [], v.features || []);
  document.getElementById("roadmapPanel").hidden = !all.length;
  for (const x of all) {
    const d = el("div", "item");
    d.append(el("div", "k", x.type + " · " + x.id + " · " + x.state), el("div", null, x.title));
    const bar = el("div", "bar"), fill = el("span");
    fill.style.width = Math.max(0, Math.min(100, x.rollup.percent)) + "%";
    bar.append(fill);
    d.append(bar, el("div", "m", rollupText(x.rollup)));
    d.addEventListener("click", () => showDetail(x.id));
    root.append(d);
  }
}

// ---------------------------------------------------------------- forms
// Every form field is registered under the name of its `ait` option, so a
// refusal from the command line can point at the field it is about.
function field(form, label, input, full, key) {
  const l = el("label", full ? "full" : null, label);
  form.append(l, input);
  if (full) input.classList.add("full");
  form._fields = form._fields || {};
  form._fields[key || label.toLowerCase()] = input;
  input.addEventListener("input", () => input.classList.remove("bad"));
  input.addEventListener("change", () => input.classList.remove("bad"));
  return input;
}
// A field that fails a check in the form: red, focused, with the reason.
function bad(input, why) {
  input.classList.add("bad");
  input.title = why;
  input.focus();
  return why;
}
// Which fields a CLI error is about: a field named as --option or as
// "unknown/invalid <option>", and any field whose value the message quotes.
function fieldsForError(fields, err) {
  const msg = err.message || "";
  const lower = msg.toLowerCase();
  const hit = new Set();
  const quoted = [...msg.matchAll(/'([^']+)'/g)].map(m => m[1].toLowerCase());
  for (const [key, input] of Object.entries(fields)) {
    const v = (input.value || "").trim().toLowerCase();
    if (lower.includes("--" + key) || new RegExp("\\b(unknown|invalid|bad|empty) " + key + "\\b").test(lower) || lower.startsWith(key + " ")) hit.add(input);
    if (v && quoted.some(q => q === v || v.split(/[\s,]+/).map(x => x.split(":")[0]).includes(q))) hit.add(input);
  }
  if (["INVALID_ID", "UNKNOWN_PREFIX", "ID_TAKEN", "GROUP_FULL"].includes(err.code) && fields.id) hit.add(fields.id);
  if (err.code === "NEEDS_REASON" && fields.reason) hit.add(fields.reason);
  return [...hit];
}
// Shows a refusal inside the form (which stays open with everything typed)
// and marks the fields it is about. `retry` re-sends with --force when the
// command line offers that override.
function showFormError(box, fields, err, args, retry) {
  for (const input of Object.values(fields || {})) input.classList.remove("bad");
  box.replaceChildren(el("div", null, err.message), el("div", "code", err.code));
  if (retry && canForce(err, args)) {
    const b = el("button", "danger", "Override (--force)");
    b.type = "button";
    b.addEventListener("click", () => retry(args.concat(["--force"])));
    box.append(el("div", "w", "The command line asks for --force here. Only override if you mean to."), b);
  }
  box.hidden = false;
  const marked = fieldsForError(fields || {}, err);
  for (const input of marked) { input.classList.add("bad"); input.title = err.message; }
  if (marked.length) marked[0].focus();
  box.scrollIntoView({ block: "nearest" });
}
// Runs a form's command. On success: message, refresh, `after`. On a
// refusal: throws, so the caller keeps its form open.
async function submit(args, okMsg, after) {
  const res = await run(args);
  toast(okMsg || ("ait " + args[0] + " done"), false);
  await refresh();
  if (after) after(res);
  return res;
}
function inp(value, placeholder) {
  const i = el("input");
  i.value = value || "";
  if (placeholder) i.placeholder = placeholder;
  return i;
}
function sel(options, value) {
  const s = el("select");
  for (const o of options) {
    const [v, label] = Array.isArray(o) ? o : [o, o === "" ? "(none)" : o];
    const opt = el("option", null, label);
    opt.value = v;
    s.append(opt);
  }
  s.value = value || "";
  return s;
}
// The configured agent tiers as a list; free text when none are configured.
function agentInput(value) {
  const tiers = Object.keys(agentTiers);
  if (!tiers.length) return inp(value, "tier, e.g. standard (optional)");
  const opts = [["", "(none)"]].concat(tiers.map(t => [t, t + " (" + agentTiers[t] + ")"]));
  if (value && !tiers.includes(value)) opts.push([value, value + " (not configured)"]);
  return sel(opts, value);
}
function openDialog(title, build, submitLabel, onSubmit) {
  const dlg = document.getElementById("dlg");
  const form = document.getElementById("dlgform");
  form.replaceChildren(el("h2", null, title));
  const grid = el("div", "form");
  form.append(grid);
  const get = build(grid);
  const errBox = el("div", "formerr");
  errBox.hidden = true;
  errBox.setAttribute("role", "alert");
  form.append(errBox);
  const row = el("div", "row");
  const ok = el("button", "primary", submitLabel);
  ok.type = "button";
  const cancel = el("button", null, "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", () => dlg.close());
  // The dialog closes only when the command succeeds; a refusal is shown
  // in the dialog with the bad fields in red, and nothing typed is lost.
  const send = async args => {
    ok.disabled = true;
    try {
      const [cmd, okMsg, after] = onSubmit(args);
      await submit(cmd, okMsg, after);
      dlg.close();
    } catch (e) {
      showFormError(errBox, grid._fields, e, args, send);
    } finally {
      ok.disabled = false;
    }
  };
  ok.addEventListener("click", () => {
    for (const input of Object.values(grid._fields || {})) input.classList.remove("bad");
    errBox.hidden = true;
    let args;
    try { args = get(); } catch (why) {
      errBox.replaceChildren(el("div", null, String(why)));
      errBox.hidden = false;
      return;
    }
    if (args) send(args);
  });
  row.append(ok, cancel);
  form.append(row);
  dlg.showModal();
}
// Form checks before anything is sent. `need(input, why)` throws, which
// the dialog shows next to the field.
function need(input, why) { throw bad(input, why); }
const ID_RE = /^[A-Za-z]{2,5}(-\d+(-\d{2})?)?$/;
function stateDialog(i, preset) {
  openDialog("Change state of " + i.id, g => {
    const st = field(g, "State", sel(STATES, preset || i.state));
    const rs = field(g, "Reason", inp(i.reason, "needed for blocked, decision and dropped"));
    st.focus();
    g.append(el("div", "full w", "Same rules as `ait state`: the last three states need a reason; done issues reopen only with --force; use Done to close."));
    return () => {
      if (NEEDS_REASON.includes(st.value) && !rs.value.trim()) need(rs, "A reason is required for " + st.value + ".");
      const a = ["state", i.id, st.value];
      if (rs.value.trim()) a.push("--reason", rs.value.trim());
      return a;
    };
  }, "Change state", a => [a, i.id + " is " + a[2], () => showDetail(i.id)]);
}
function doneDialog(i) {
  openDialog("Close " + i.id + " as done", g => {
    const sm = field(g, "Summary", el("textarea"), true, "summary");
    sm.style.minHeight = "80px";
    sm.placeholder = "what was delivered (required)";
    const ran = field(g, "Ran", inp("", "what actually did the work, e.g. sonnet, effort high (optional)"), false, "ran");
    g.append(el("div", "full w", "Same rules as `ait done`: a summary is required; closing needs the live claim, so from here the command line's refusal is shown and you can override it with --force."));
    return () => {
      if (!sm.value.trim()) need(sm, "A summary of what was delivered is required.");
      const a = ["done", i.id, "--summary", sm.value.trim()];
      if (ran.value.trim()) a.push("--ran", ran.value.trim());
      return a;
    };
  }, "Close as done", a => [a, i.id + " is done", () => showDetail(i.id)]);
}
function shipDialog(i) {
  openDialog("Release " + i.id, g => {
    const rf = field(g, "Reference", inp("", "tag or commit, e.g. v1.2 (optional)"), false, "ref");
    g.append(el("div", "full w", "Same rules as `ait ship`: every member must be done, each task merged on main with its Issue-ID trailer, and pushed to origin when a remote exists. The refusal is shown if not."));
    return () => {
      const a = ["ship", i.id];
      if (rf.value.trim()) a.push("--ref", rf.value.trim());
      return a;
    };
  }, "Release", a => [a, i.id + " released", () => showDetail(i.id)]);
}
function newDialog() {
  const prefixes = [...new Set(issues.map(x => x.id.split("-")[0]))].sort();
  openDialog("New issue", g => {
    const pf = field(g, "Prefix or id", inp("", "e.g. CORE, CORE-2 or CORE-2-05"), false, "id");
    const dl = el("datalist");
    dl.id = "prefixes";
    for (const p of prefixes) { const o = el("option"); o.value = p; dl.append(o); }
    g.append(dl);
    pf.setAttribute("list", "prefixes");
    const ti = field(g, "Title", inp("", "one line (required)"), false, "title");
    const ty = field(g, "Type", sel(TYPES, "task"));
    const pr = field(g, "Priority", sel(PRIORITIES, "P2"));
    const st = field(g, "State", sel(STATES, "ready"));
    const rs = field(g, "Reason", inp("", "for blocked, decision, dropped"));
    const pa = field(g, "Parent", inp("", "feature id (optional)"));
    const rl = field(g, "Release", inp("", "release or milestone id (optional)"));
    const nd = field(g, "Needs", inp("", "ids, comma separated; ID:in_review waits for that state"));
    const ag = field(g, "Agent", agentInput(""), false, "agent");
    const ef = field(g, "Effort", sel(EFFORTS, ""));
    const ac = field(g, "Acceptance criteria", el("textarea"), true, "criteria");
    ac.placeholder = "one per line; all must be checked before review or done";
    ac.style.minHeight = "60px";
    const bd = field(g, "Description", el("textarea"), true, "body");
    bd.placeholder = "Markdown";
    pf.focus();
    return () => {
      if (!pf.value.trim()) need(pf, "A prefix (CORE), group (CORE-2) or full id (CORE-2-05) is required.");
      if (!ID_RE.test(pf.value.trim())) need(pf, "'" + pf.value.trim() + "' is not a prefix (2-5 letters), group (CORE-2) or id (CORE-2-05).");
      if (!ti.value.trim()) need(ti, "A title is required.");
      if (NEEDS_REASON.includes(st.value) && !rs.value.trim()) need(rs, "A reason is required for " + st.value + ".");
      if (["done", "released", "in_review"].includes(st.value)) need(st, "New issues cannot start as " + st.value + ".");
      if (ty.value === "review" && !pa.value.trim()) need(pa, "A review needs a parent: the issue it reviews.");
      const a = ["add", pf.value.trim(), ti.value.trim(), "--type", ty.value, "--priority", pr.value, "--state", st.value];
      const opt = (name, v) => { if (v.trim()) a.push("--" + name, v.trim()); };
      opt("reason", rs.value); opt("parent", pa.value); opt("release", rl.value); opt("needs", nd.value);
      opt("agent", ag.value); opt("effort", ef.value); opt("criteria", ac.value); opt("body", bd.value);
      return a;
    };
  }, "Add issue", a => [a, "issue added", res => { if (res && res.issue) showDetail(res.issue.id); }]);
}

// ---------------------------------------------------------------- detail
async function showDetail(id) {
  selected = id;
  const box = document.getElementById("detail");
  try {
    const v = await get("/api/issue/" + encodeURIComponent(id));
    const i = v.issue;
    box.replaceChildren();
    const h = el("h2", null, i.id + "  " + i.title);
    box.append(h, el("span", "chip", i.state + (i.reason ? ": " + i.reason : "")));
    if (v.claim && v.claim.session) box.append(el("span", "chip", "claimed by " + v.claim.session + " (gen " + v.claim.generation + ", " + v.claim.status + ")"));
    box.append(el("span", "chip", v.ready ? "ready" : "not offered"));
    box.append(el("span", "chip", i.type + " · " + i.priority));
    if (i.agent) box.append(el("span", "chip", "agent " + i.agent + (i.agent_model ? " (" + i.agent_model + ")" : "") + (i.effort ? ", effort " + i.effort : "")));
    else if (i.effort) box.append(el("span", "chip", "effort " + i.effort));
    if (i.reviewer) box.append(el("span", "chip", "reviewer " + i.reviewer));
    if (i.parent) box.append(el("span", "chip", "parent " + i.parent));
    if (i.release) box.append(el("span", "chip", "release " + i.release));
    if (v.rollup) box.append(el("p", null, "Progress: " + rollupText(v.rollup)));
    if (i.summary) box.append(el("p", null, "Done: " + i.summary));
    else for (const b of v.blockers || []) box.append(el("p", null, "• " + b.message));
    if (i.ran) box.append(el("p", null, "Ran: " + i.ran));
    if (WRITABLE) {
      const row = el("div", "row");
      const btn = (label, cls, fn) => { const b = el("button", cls, label); b.addEventListener("click", fn); row.append(b); };
      btn("Edit", "primary", () => editForm(box, i));
      btn("State…", null, () => stateDialog(i));
      if (!FINISHED.includes(i.state) && i.state !== "in_review" && i.type !== "review") btn("Submit for review", null, () => act(["state", i.id, "in_review"], i.id + " is in review", () => showDetail(i.id)));
      if (!FINISHED.includes(i.state)) btn("Done…", null, () => doneDialog(i));
      if (i.state === "done" || (i.state !== "released" && v.rollup)) btn("Release…", null, () => shipDialog(i));
      btn("Top", null, () => act(["move", i.id, "--top"], i.id + " ranks first"));
      btn("Bottom", null, () => act(["move", i.id, "--bottom"], i.id + " ranks last"));
      box.append(row);
    }
    const crit = v.criteria || [];
    if (crit.length || WRITABLE) {
      const openN = crit.filter(x => !x.done).length;
      box.append(el("h3", null, "Acceptance criteria" + (crit.length ? " (" + (crit.length - openN) + "/" + crit.length + ")" : "")));
      const ul = el("ul", "crit");
      for (const x of crit) {
        const li = el("li");
        const cb = el("input");
        cb.type = "checkbox";
        cb.checked = x.done;
        cb.disabled = !WRITABLE;
        cb.title = x.done ? "checked by " + (x.done_by || "-") + " " + ago(x.done_at) : "not checked yet";
        cb.addEventListener("change", () => act(["criteria", i.id, x.done ? "--uncheck" : "--check", String(x.n)], "criterion " + x.n + (x.done ? " unchecked" : " checked"), () => showDetail(i.id)));
        li.append(cb, el("span", x.done ? "done" : null, x.text));
        ul.append(li);
      }
      if (!crit.length) ul.append(el("li", "w", "none"));
      box.append(ul);
      if (WRITABLE && !FINISHED.includes(i.state)) {
        const ni = inp("", "add a criterion");
        ni.addEventListener("keydown", e => { if (e.key === "Enter" && ni.value.trim()) act(["criteria", i.id, "--add", ni.value.trim()], "criterion added", () => showDetail(i.id)); });
        box.append(ni);
      }
    }
    if (i.body) box.append(el("pre", null, i.body));
    if (v.latest_handoff) { box.append(el("h3", null, "Latest handoff")); box.append(el("pre", null, v.latest_handoff.body)); }
    if ((v.notes || []).length) {
      box.append(el("h3", null, "Notes (" + v.note_count + ")"));
      const pre = el("pre");
      pre.textContent = v.notes.map(n => "[" + n.kind + " " + n.at + " " + (n.session || "-") + "] " + n.body).join("\n");
      box.append(pre);
    }
    if (WRITABLE) {
      const ta = el("textarea");
      ta.placeholder = "add a note (notes are never edited)";
      ta.style.minHeight = "60px";
      const b = el("button", null, "Add note");
      b.addEventListener("click", () => { if (ta.value.trim()) act(["note", i.id, ta.value.trim()], "note added", () => showDetail(i.id)); });
      box.append(el("h3", null, "Note"), ta, b);
    }
    const close = el("button", null, "close");
    close.addEventListener("click", () => { box.hidden = true; selected = null; renderColumns(); });
    box.append(el("div", "row"), close);
    box.hidden = false;
    renderColumns();
  } catch (e) {
    box.replaceChildren(el("div", "m", "could not load " + id));
    box.hidden = false;
  }
}
function editForm(box, i) {
  box.replaceChildren(el("h2", null, "Edit " + i.id));
  const g = el("div", "form");
  box.append(g);
  const f = {
    title: field(g, "Title", inp(i.title)),
    priority: field(g, "Priority", sel(PRIORITIES, i.priority)),
    type: field(g, "Type", sel(TYPES, i.type)),
    agent: field(g, "Agent", agentInput(i.agent || "")),
    effort: field(g, "Effort", sel(EFFORTS, i.effort || "")),
    reviewer: field(g, "Reviewer", inp(i.reviewer)),
    parent: field(g, "Parent", inp(i.parent)),
    release: field(g, "Release", inp(i.release)),
    size: field(g, "Size", inp(i.size)),
    spec: field(g, "Spec", inp(i.spec)),
    body: field(g, "Description", el("textarea"), true, "body"),
  };
  f.body.value = i.body || "";
  f.body.style.minHeight = "220px";
  const errBox = el("div", "formerr");
  errBox.hidden = true;
  errBox.setAttribute("role", "alert");
  box.append(errBox);
  const row = el("div", "row");
  const save = el("button", "primary", "Save");
  const cancel = el("button", null, "Cancel");
  cancel.addEventListener("click", () => showDetail(i.id));
  save.addEventListener("click", () => {
    // Only changed fields; --version refuses the save if someone else
    // changed the issue since it was loaded (same as `ait edit --version`).
    const a = ["edit", i.id, "--version", String(i.version)];
    for (const [k, input] of Object.entries(f)) {
      const before = i[k] === null || i[k] === undefined ? "" : String(i[k]);
      const now = k === "body" ? input.value : input.value.trim();
      if (now !== before) a.push("--" + k, now);
    }
    if (a.length === 4) { showDetail(i.id); return; }
    for (const input of Object.values(f)) input.classList.remove("bad");
    errBox.hidden = true;
    if (!f.title.value.trim()) { errBox.replaceChildren(el("div", null, bad(f.title, "The title cannot be empty."))); errBox.hidden = false; return; }
    if (f.type.value === "review" && !f.parent.value.trim()) { errBox.replaceChildren(el("div", null, bad(f.parent, "A review needs a parent: the issue it reviews."))); errBox.hidden = false; return; }
    // The form stays open with everything typed until the save succeeds.
    const send = async args => {
      save.disabled = true;
      try { await submit(args, i.id + " saved", () => showDetail(i.id)); }
      catch (e) { showFormError(errBox, g._fields, e, args, send); }
      finally { save.disabled = false; }
    };
    send(a);
  });
  row.append(save, cancel);
  box.append(row);
  box.hidden = false;
}

// ---------------------------------------------------------------- refresh
async function refresh() {
  const win = document.getElementById("statsWindow").value;
  const [iv, av, rv, nv, sv] = await Promise.all([get("/api/issues"), get("/api/activity?limit=40"), get("/api/roadmap"), get("/api/next"), get("/api/stats" + (win ? "?since=" + win : ""))]);
  renderStats(sv);
  issues = iv.issues;
  wip = iv.wip || {};
  agentTiers = iv.agent_tiers || {};
  renderNext(nv);
  renderColumns();
  renderFeed(av.events);
  renderRoadmap(rv);
  const count = col => issues.filter(i => i.column === col).length;
  const stale = issues.filter(i => i.stale).length;
  document.getElementById("summary").textContent =
    count("ready") + " ready · " + count("waiting") + " waiting · " + count("in_progress") + " in progress" +
    (stale ? " (" + stale + " stale)" : "") + " · " + count("in_review") + " in review · " + count("done") + " done · " + count("released") + " released";
  head = iv.head;
  lastFull = Date.now();
}
async function poll() {
  try {
    const h = await get("/api/head");
    // New events trigger a reload; leases expire without events, so also
    // reload every 30 s. Skip while a card is being dragged.
    if (!dragId && (h.head !== head || Date.now() - lastFull > 30000)) {
      await refresh();
      const d = document.getElementById("detail");
      if (selected && !d.hidden && !d.querySelector(".form") && !d.contains(document.activeElement)) showDetail(selected);
    }
    document.getElementById("live").textContent = "live · " + (WRITABLE ? "editable" : "read-only") + " · " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("live").textContent = "server not reachable";
  }
  setTimeout(poll, 1500);
}
document.getElementById("statsWindow").addEventListener("change", () => refresh());
if (WRITABLE) {
  const nb = document.getElementById("newbtn");
  nb.hidden = false;
  nb.addEventListener("click", newDialog);
}
poll();
</script>
