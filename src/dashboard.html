<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ait-token" content="__AIT_TOKEN__">
<meta name="ait-writable" content="__AIT_WRITABLE__">
<title>ait board</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6ec;
  --accent: #2f6fde; --ok: #1f8a4c; --warn: #b26b00; --bad: #c4372f; --chip: #eef1f6;
  --scroll: #c5cad3; --scroll-hover: #a3abb8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #98a2b3; --line: #2a313d;
    --accent: #6b9cff; --ok: #4cc38a; --warn: #f0b45a; --bad: #ff7b72; --chip: #252c38;
    --scroll: #343c4a; --scroll-hover: #4a5466;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
/* Scroll bars follow the theme: slim, rounded thumb on a transparent track.
   Chrome/Edge/Safari use the ::-webkit-scrollbar rules (no arrow buttons);
   Firefox, which has no such rules, gets scrollbar-color/scrollbar-width.
   The standard properties are kept to Firefox because in Chrome 121+ they
   switch the ::-webkit-scrollbar rules off and bring the arrows back. */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); }
::-webkit-scrollbar-button { display: none; }
@supports (-moz-appearance: none) {
  * { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
}
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 17px; margin: 0; }
#summary { color: var(--muted); }
#nextup { font-size: 13px; overflow-wrap: anywhere; }
#nextup b { color: var(--accent); cursor: pointer; }
#live { margin-left: auto; color: var(--muted); font-size: 12px; }
#panels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 16px 16px 0; align-items: start; }
@media (max-width: 1200px) { #panels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { #panels { grid-template-columns: 1fr; } }
#panels .panel { height: 360px; display: flex; flex-direction: column; }
@media (max-width: 700px) { #panels .panel { height: auto; max-height: 360px; } }
.dist { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 12px; }
.dist .bar { display: flex; height: 16px; border-radius: 3px; overflow: hidden; background: var(--chip); }
.dist .bar span { display: block; height: 100%; font-size: 10px; line-height: 16px; text-align: center; color: #fff; overflow: hidden; white-space: nowrap; }
.dist .bar span.dk { color: #1a1a1a; }
.dist .none { color: var(--muted); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); margin: 0 0 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; vertical-align: middle; }
.seg button { border: 0; border-radius: 0; padding: 1px 7px; font-size: 11px; background: transparent; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
#panels .panel > :not(h2) { min-height: 0; overflow-y: auto; }
main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; }
main.withdetail { grid-template-columns: 1fr 380px; }
@media (max-width: 900px) { main.withdetail { grid-template-columns: 1fr; } }
#columns { display: grid; grid-template-columns: repeat(7, minmax(165px, 1fr)); gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 4px; min-width: 0; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.col.over { outline: 2px dashed var(--accent); }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.col h2 .n { color: var(--muted); }
.col h2 .n.full { color: var(--bad); font-weight: 600; }
.col[data-col=in_progress] h2 { color: var(--accent); }
.col[data-col=in_review] h2 { color: var(--accent); }
.col[data-col=waiting] h2 { color: var(--warn); }
.col[data-col=done] h2 { color: var(--ok); }
.col[data-col=released] h2 { color: var(--ok); }
.col h2 .tog { font-size: 11px; padding: 0 6px; text-transform: none; letter-spacing: 0; }
.col h2 .tog.on { background: var(--bad); border-color: var(--bad); color: #fff; }
.card.stale { border-color: var(--bad); }
.card .st { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--bad); }
.cards { padding: 8px; display: grid; gap: 8px; max-height: 70vh; overflow-y: auto; min-height: 48px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 8px; cursor: pointer; background: var(--bg); }
.card:hover, .card:focus { border-color: var(--accent); outline: none; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.drop { border-top: 3px solid var(--accent); }
.card.dragging { opacity: .4; }
.card .id { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.card .t { margin-top: 2px; overflow-wrap: anywhere; }
.card .m { margin-top: 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.card .id .p { margin-left: 6px; color: var(--accent); }
.card .id .p.P0, .card .id .p.P1 { color: var(--bad); font-weight: 600; }
.card .ty, #listview .ty { margin-left: 6px; font-size: 11px; text-transform: uppercase; color: var(--warn); }
.ty.bug { color: #fff !important; background: var(--bad); border-radius: 3px; padding: 0 4px; font-weight: 600; }
.card .nx { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--ok); }
.empty { color: var(--muted); font-size: 12px; padding: 4px; }
aside { display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.panel h2 { font-size: 13px; margin: 0 0 8px; }
.panel h3 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; align-content: start; }
#feed li { border-bottom: 1px solid var(--line); padding-bottom: 6px; overflow-wrap: anywhere; }
.w { color: var(--muted); }
#detail pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; max-height: 40vh; overflow-y: auto; }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.views button { border: 0; border-radius: 0; }
.views button.on { background: var(--accent); color: #fff; }
#search { width: 220px; }
.lbl { display: inline-block; font-size: 11px; background: var(--chip); color: var(--muted); border-radius: 8px; padding: 0 6px; margin: 2px 4px 0 0; }
#listview { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
#listview .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
#listview .filters select, #listview .filters input { width: auto; }
#listview .tablewrap { overflow-x: auto; }
#listview table { width: 100%; border-collapse: collapse; font-size: 13px; }
#listview th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
#listview th.nosort { cursor: default; }
#listview td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
#listview td.id { font: 12px ui-monospace, Consolas, monospace; white-space: nowrap; }
#listview tr.sel td { background: var(--chip); }
#listview .acts button { padding: 0 6px; margin-right: 4px; }
#listview .pbar { width: 70px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
#listview .pbar span { display: block; height: 100%; background: var(--ok); }
#relview { display: grid; gap: 16px; min-width: 0; }
#relview .rel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
#relview .rel h2 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
#relview .rel h2 button { font-size: 12px; margin-left: 8px; vertical-align: middle; }
#relview .rel .meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
#relview .rel .meta .late { color: var(--bad); font-weight: 600; }
#relview table { width: 100%; border-collapse: collapse; font-size: 13px; }
#relview th { text-align: left; color: var(--muted); font-weight: 600; padding: 5px 6px; border-bottom: 1px solid var(--line); }
#relview td { padding: 5px 6px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
#relview td.id { font: 12px ui-monospace, Consolas, monospace; white-space: nowrap; }
#relview tr.item { cursor: pointer; }
#relview tr.item:hover td { background: var(--chip); }
#relview tr.dropped td { color: var(--muted); text-decoration: line-through; }
#relview .pbar { width: 70px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
#relview .pbar span { display: block; height: 100%; background: var(--ok); }
#bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px; margin-bottom: 8px; border: 1px solid var(--accent); border-radius: 6px; font-size: 13px; }
#bulk select, #bulk input { width: auto; }
.crit .ev { display: block; font-size: 12px; color: var(--muted); }
.chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; margin: 2px 4px 2px 0; }
#nextlist ol { margin: 0; padding-left: 22px; font-size: 13px; }
#nextlist li { cursor: pointer; overflow-wrap: anywhere; margin-bottom: 3px; }
#roadmap .item { padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; overflow-wrap: anywhere; }
#roadmap .item:last-child { border-bottom: 0; }
#roadmap .k { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }
#roadmap .bar { height: 6px; background: var(--chip); border-radius: 3px; margin-top: 4px; overflow: hidden; }
#roadmap .bar span { display: block; height: 100%; background: var(--ok); }
#roadmap .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
button { font: inherit; background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
.form { display: grid; grid-template-columns: 90px 1fr; gap: 6px 8px; align-items: center; font-size: 13px; }
.form label { color: var(--muted); }
.form .full { grid-column: 1 / -1; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; width: 100%; min-width: 0; }
textarea { min-height: 140px; font: 12px ui-monospace, Consolas, monospace; resize: vertical; }
.crit { list-style: none; margin: 4px 0 8px; padding: 0; font-size: 13px; }
.crit li { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; overflow-wrap: anywhere; }
.crit input { width: auto; margin-top: 3px; flex: none; }
.crit span { flex: 1; min-width: 0; }
.crit .rm { flex: none; padding: 0 6px; font-size: 12px; line-height: 18px; }
.crit .done { color: var(--muted); text-decoration: line-through; }
#stats table { width: 100%; border-collapse: collapse; font-size: 12px; }
#stats th, #stats td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
#stats th:first-child, #stats td:first-child { text-align: left; }
#stats th { color: var(--muted); font-weight: 500; }
#stats .slow { color: var(--bad); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { font-size: 15px; margin: 0 0 10px; }
#toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,.18); z-index: 10; overflow-wrap: anywhere; }
#toast.err { border-left-color: var(--bad); }
#toast > div:first-child { white-space: pre-line; }
#toast .code { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
input.bad, select.bad, textarea.bad { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.formerr { grid-column: 1 / -1; border: 1px solid var(--bad); border-left: 4px solid var(--bad); border-radius: 6px; padding: 6px 8px; margin: 8px 0; white-space: pre-line; overflow-wrap: anywhere; font-size: 13px; }
.formerr .code { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>ait board</h1>
  <span id="summary">loading…</span>
  <span id="nextup"></span>
  <span class="views" role="tablist"><button id="vboard" class="on" type="button">Board</button><button id="vlist" type="button">List</button><button id="vrel" type="button">Releases</button></span>
  <input id="search" type="search" placeholder="Search id, title, description, labels" aria-label="search issues">
  <button id="newbtn" class="primary" hidden>+ New issue</button>
  <span id="live"></span>
</header>
<section id="panels" aria-label="Overview">
  <div class="panel" id="nextlist"><h2>Next up</h2><div id="nextbody" class="w">loading…</div></div>
  <div class="panel" id="statsPanel"><h2>Flow: time in each column <select id="statsWindow" aria-label="time window" style="width:auto;font-size:12px"><option value="7d">7 days</option><option value="30d" selected>30 days</option><option value="">all time</option></select> <span class="seg" id="statsMode"><button type="button" data-m="table">Table</button><button type="button" data-m="chart">Chart</button></span></h2><div id="stats" class="w">loading…</div></div>
  <div class="panel" id="roadmapPanel"><h2>Roadmap</h2><div id="roadmap"></div></div>
  <div class="panel"><h2>Activity <span class="w" id="feedcount"></span></h2><ul id="feed"></ul></div>
</section>
<main id="main">
  <section id="columns" aria-label="Board columns"></section>
  <section id="listview" aria-label="All issues" hidden></section>
  <section id="relview" aria-label="Releases" hidden></section>
  <aside>
    <div class="panel" id="detail" hidden></div>
  </aside>
</main>

<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<div id="toast" hidden></div>

<script>
"use strict";
// All tracker text is untrusted: it is only ever inserted with textContent
// or as form values, never as HTML.
let TOKEN = document.querySelector('meta[name="ait-token"]').content;
const WRITABLE = document.querySelector('meta[name="ait-writable"]').content === "true" && /^[0-9a-f]{32}$/.test(TOKEN);
// Left to right: the way work flows.
const COLS = [
  ["backlog", "Backlog"], ["ready", "Ready"], ["waiting", "Waiting"],
  ["in_progress", "In progress"], ["in_review", "In review"], ["done", "Done"], ["released", "Released"]
];
const STATES = [
  ["idea", "idea: not shaped yet"], ["planned", "planned: shaped, later / deferred"],
  ["ready", "ready: can be built now"], ["blocked", "blocked: waiting on something (reason)"],
  ["decision", "decision: needs the owner (reason)"], ["dropped", "dropped: won't do (reason)"],
  ["in_review", "in_review: built, waiting for its reviews"]
];
const NEEDS_REASON = ["blocked", "decision", "dropped"];
const TYPES = ["task", "bug", "review", "feature", "milestone", "release"];
const FINISHED = ["done", "released"];
const PRIORITIES = ["P0", "P1", "P2", "P3", "P4"];
const EFFORTS = ["", "low", "medium", "high", "xhigh", "max"];
let view = "board", searchIds = null, listState = { sort: "created", dir: "desc", state: "", type: "", label: "", limit: 50, picked: new Set() };
let feedLimit = 40, wip = {}, agentTiers = {}, head = -1, lastFull = 0, issues = [], nextIds = [], selected = null, dragId = null, staleOnly = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
async function get(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}
function ago(iso) {
  if (!iso) return "";
  const d = (Date.parse(iso) - Date.now()) / 1000, a = Math.abs(d);
  const s = a < 60 ? Math.round(a) + "s" : a < 3600 ? Math.round(a / 60) + "m" : a < 86400 ? Math.round(a / 3600) + "h" : Math.round(a / 86400) + "d";
  return d >= 0 ? "in " + s : s + " ago";
}

// ---------------------------------------------------------------- writes
// Every write runs an ait command on the server, with the same checks as
// the command line. Errors come back in the CLI's format.
class AitError extends Error {
  constructor(e) { super(e.message || "error"); this.code = e.code || "ERROR"; }
}
// `ait serve` makes a new token on every start. If the server was restarted
// while this page stayed open, read the new token from the page once and
// retry, instead of refusing every change until a reload.
async function freshToken() {
  try {
    const page = await (await fetch("/", { cache: "no-store" })).text();
    const m = page.match(/name="ait-token" content="([0-9a-f]{32})"/);
    return m ? m[1] : null;
  } catch (e) { return null; }
}
async function run(args, retried) {
  const r = await fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Ait-Token": TOKEN },
    body: JSON.stringify({ args })
  });
  let v = {};
  try { v = await r.json(); } catch (e) { /* not JSON */ }
  if (r.status === 403 && !retried && v.error && /token/.test(v.error.message || "")) {
    const t = await freshToken();
    if (t && t !== TOKEN) { TOKEN = t; return run(args, true); }
    throw new AitError({ code: v.error.code, message: "The dashboard server was restarted or is read-only now. Reload the page." });
  }
  if (!r.ok || v.error) throw new AitError(v.error || { message: "HTTP " + r.status });
  return v.result;
}
let toastTimer = null;
function toast(msg, isErr, extra) {
  const t = document.getElementById("toast");
  t.replaceChildren();
  t.className = isErr ? "err" : "";
  t.append(el("div", null, msg));
  if (extra) t.append(extra);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isErr ? 15000 : 4000);
}
// The CLI asks for --force where the owner may override a gate (someone
// else's claim, closing without a claim, reopening done work). The
// dashboard shows the refusal and offers the same override explicitly.
function canForce(err, args) {
  return !args.includes("--force") && (["NOT_CLAIMED", "NOT_SHIPPABLE", "REVIEWS_OPEN"].includes(err.code) || /--force/.test(err.message));
}
async function act(args, okMsg, after) {
  try {
    const res = await run(args);
    toast(okMsg || ("ait " + args[0] + " done"), false);
    await refresh();
    if (after) after(res);
    return res;
  } catch (e) {
    const box = el("div");
    box.append(el("div", "code", e.code));
    if (canForce(e, args)) {
      const b = el("button", "danger", "Override (--force)");
      b.addEventListener("click", () => { document.getElementById("toast").hidden = true; act(args.concat(["--force"]), okMsg, after); });
      box.append(el("div", "w", "The command line asks for --force here. Only override if you mean to."), b);
    }
    toast(e.message, true, box);
    await refresh();
    return null;
  }
}

// ---------------------------------------------------------------- board
function card(i) {
  const c = el("div", "card" + (i.id === selected ? " sel" : "") + (i.stale ? " stale" : ""));
  c.tabIndex = 0;
  c.dataset.id = i.id;
  const idl = el("div", "id", i.id);
  if (i.priority && i.priority !== "P2") idl.append(el("span", "p " + i.priority, i.priority));
  if (i.type && i.type !== "task") idl.append(el("span", "ty" + (i.type === "bug" ? " bug" : ""), i.type));
  const pos = nextIds.indexOf(i.id);
  if (pos === 0) idl.append(el("span", "nx", "NEXT"));
  else if (pos > 0) idl.append(el("span", "nx", "#" + (pos + 1)));
  if (i.stale) idl.append(el("span", "st", "STALE"));
  c.append(idl, el("div", "t", i.title));
  if ((i.labels || []).length) { const lw = el("div"); for (const l of i.labels) lw.append(el("span", "lbl", l)); c.append(lw); }
  let meta = "";
  if (i.column === "in_progress") meta = i.session + (i.stale ? " · lease ended " : " · lease ") + ago(i.lease_until);
  else if (i.column === "waiting") meta = i.wait || (i.state + (i.reason ? ": " + i.reason : ""));
  else if (i.column === "done") meta = "done " + ago(i.done_at);
  else if (i.column === "released") meta = "released " + ago(i.released_at);
  else if (i.column === "backlog") meta = i.wait || i.state;

    for (const [k, input] of Object.entries(f)) {

      const now = k === "body" ? input.value : k === "labels" ? normLabels(input.value) : input.value.trim();

// Bulk changes run one `ait edit` / `ait state` per issue, with the same
// checks; refusals are listed, the rest still apply.
function bulkBar() {
  const s = listState;
  const bar = el("div");
  bar.id = "bulk";
  const what = sel([["priority", "set priority"], ["state", "set state"], ["parent", "set parent"], ["labels", "set labels"]], "priority");
  const pr = sel(PRIORITIES, "P2");
  const stt = sel(STATES.map(x => x[0]), "planned");
  const rs = inp("", "reason (blocked, decision, dropped)");
  const pa = inp("", "parent id (empty clears)");
  const lb = inp("", "labels, comma separated");
  const show = () => { pr.hidden = what.value !== "priority"; stt.hidden = rs.hidden = what.value !== "state"; pa.hidden = what.value !== "parent"; lb.hidden = what.value !== "labels"; };
  what.addEventListener("change", show);
  show();
  const go = el("button", "primary", "Apply to " + s.picked.size);
  go.addEventListener("click", async () => {
    const ids = [...s.picked];
    if (what.value === "state" && NEEDS_REASON.includes(stt.value) && !rs.value.trim()) { bad(rs, "A reason is required for " + stt.value + "."); return; }
    go.disabled = true;
    const failed = [];
    for (const id of ids) {
      let a;
      if (what.value === "priority") a = ["edit", id, "--priority", pr.value];
      else if (what.value === "parent") a = ["edit", id, "--parent", pa.value.trim()];
      else if (what.value === "labels") a = ["edit", id, "--labels", lb.value];
      else { a = ["state", id, stt.value]; if (rs.value.trim()) a.push("--reason", rs.value.trim()); }
      try { await run(a); } catch (e) { failed.push(id + ": " + e.message); }
    }
    await refresh();
    if (failed.length) toast((ids.length - failed.length) + " of " + ids.length + " changed. Refused:\n" + failed.join("\n"), true);
    else { toast(ids.length + " issues changed", false); s.picked.clear(); }
    renderList();
  });
  const clear = el("button", null, "Clear selection");
  clear.addEventListener("click", () => { s.picked.clear(); renderList(); });
  bar.append(el("b", null, s.picked.size + " selected"), what, pr, stt, rs, pa, lb, go, clear);
  return bar;
}

  if (!due) return el("span", null, "no expected date");
  const d = new Date(due + "T00:00:00");
  const days = Math.round((d - new Date(new Date().toDateString())) / 86400000);
  const s = el("span", null, "expected " + d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }));
  return s.append(document.createTextNode(days === 0 ? " (today)" : days > 0 ? " (in " + days + "d)" : "")), s;
}
function relTable(items) {
  const t = el("table");
  const hr = el("tr");
  for (const h of ["Id", "Title", "Type", "State", "Assignee", "Progress"]) hr.append(el("th", null, h));
  t.append(hr);
  for (const x of items) {
    const tr = el("tr", "item" + (x.state === "dropped" ? " dropped" : ""));
    tr.tabIndex = 0;
    tr.append(el("td", "id", x.id), el("td", null, x.title), el("td", null, x.type), el("td", null, x.state),
      el("td", null, x.assignee ? x.assignee + (x.claim_status === "stale" ? " (stale)" : "") : "–"));
    const pc = el("td");
    const bar = el("span", "pbar"), fill = el("span");
    fill.style.width = Math.max(0, Math.min(100, x.percent)) + "%";
    bar.append(fill);
    pc.append(bar, document.createTextNode(x.percent + "%"));
    tr.append(pc);
    tr.addEventListener("click", () => showDetail(x.id));
    tr.addEventListener("keydown", e => { if (e.key === "Enter") showDetail(x.id); });
    t.append(tr);
  }
  if (!items.length) { const tr = el("tr"); const td = el("td", "w", "nothing planned into it yet"); td.colSpan = 6; tr.append(td); t.append(tr); }
  return t;
}
async function renderReleases() {
  const root = document.getElementById("relview");
  let v;
  try { v = await get("/api/releases"); } catch (e) { root.replaceChildren(el("div", "w", "could not load releases")); return; }
  root.replaceChildren();
  const today = new Date().toISOString().slice(0, 10);
  for (const r of v.releases) {
    const box = el("div", "rel");
    const h = el("h2", null, r.title);
    h.style.cursor = "pointer";
    h.addEventListener("click", () => showDetail(r.id));
    const meta = el("div", "meta");
    meta.append(document.createTextNode(r.type + " · " + r.id + " · " + r.state + " · " + r.percent + "% · "), dueText(r.due));
    if (r.due && r.due < today && !FINISHED.includes(r.state) && r.state !== "dropped") meta.append(document.createTextNode(" "), el("span", "late", "overdue"));
    const live = r.items.filter(x => x.state !== "dropped").length, dropped = r.items.length - live;
    meta.append(document.createTextNode(" · " + live + " item" + (live === 1 ? "" : "s") + (dropped ? ", " + dropped + " dropped" : "")));
    if (WRITABLE && !["released", "dropped"].includes(r.state)) {
      const sb = el("button", null, "Ship");
      sb.title = "Release it: same as `ait ship " + r.id + "`";
      sb.addEventListener("click", e => { e.stopPropagation(); shipDialog(r); });
      h.append(document.createTextNode(" "), sb);
    }
    box.append(h, meta, relTable(r.items));
    root.append(box);
  }
  const un = el("div", "rel");
  un.append(el("h2", null, "Not in a release yet"), el("div", "meta", "features without a release; set one with Edit → Release"), relTable(v.unplanned));
  root.append(un);
  if (!v.releases.length) root.prepend(el("div", "w", "No releases or milestones yet. Add one with + New issue, type release, and an expected date."));
}
// Search filters the board's cards and the list (id, title, description,
// labels: every word must match).
let searchTimer = null;
async function applySearch() {
  const q = document.getElementById("search").value.trim();
  if (!q) searchIds = null;
  else {
    try {
      const v = await get("/api/list?limit=100000&q=" + encodeURIComponent(q));
      searchIds = new Set(v.issues.map(x => x.id));
    } catch (e) { searchIds = null; }
  }
  renderColumns();
  if (view === "list") { listState.limit = 50; renderList(); }
}

// ---------------------------------------------------------------- refresh
async function refresh() {
  const win = document.getElementById("statsWindow").value;
  const [iv, av, rv, nv, sv] = await Promise.all([get("/api/issues"), get("/api/activity?limit=" + (feedLimit + 1)), get("/api/roadmap"), get("/api/next"), get("/api/stats" + (win ? "?since=" + win : ""))]);
  renderStats(sv);
  issues = iv.issues;
  wip = iv.wip || {};
  agentTiers = iv.agent_tiers || {};
  renderNext(nv);
  if (searchIds && document.getElementById("search").value.trim()) {
    try { searchIds = new Set((await get("/api/list?limit=100000&q=" + encodeURIComponent(document.getElementById("search").value.trim()))).issues.map(x => x.id)); } catch (e) { /* keep the last result */ }
  }
  renderColumns();
  if (view === "list" && !document.getElementById("listview").contains(document.activeElement)) renderList();
  if (view === "releases") renderReleases();
  renderFeed(av.events);
  renderRoadmap(rv);
  const count = col => issues.filter(i => i.column === col && onBoard(i)).length;
  const stale = issues.filter(i => i.stale && onBoard(i)).length;
  document.getElementById("summary").textContent =
    count("ready") + " ready · " + count("waiting") + " waiting · " + count("in_progress") + " in progress" +
    (stale ? " (" + stale + " stale)" : "") + " · " + count("in_review") + " in review · " + count("done") + " done · " + count("released") + " released";
  head = iv.head;
  lastFull = Date.now();
}
async function poll() {
  try {
    const h = await get("/api/head");
    // New events trigger a reload; leases expire without events, so also
    // reload every 30 s. Skip while a card is being dragged.
    if (!dragId && (h.head !== head || Date.now() - lastFull > 30000)) {
      await refresh();
      const d = document.getElementById("detail");
      if (selected && !d.hidden && !d.querySelector(".form") && !d.contains(document.activeElement)) showDetail(selected);
    }
    document.getElementById("live").textContent = "live · " + (WRITABLE ? "editable" : "read-only") + " · " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("live").textContent = "server not reachable";
  }
  setTimeout(poll, 1500);
}
document.getElementById("statsWindow").addEventListener("change", () => refresh());
for (const b of document.querySelectorAll("#statsMode button")) b.addEventListener("click", () => {
  statsMode = b.dataset.m;
  try { localStorage.setItem("ait-stats-mode", statsMode); } catch (e) { /* per-browser convenience only */ }
  if (lastStats) renderStats(lastStats);
});
document.getElementById("vboard").addEventListener("click", () => setView("board"));
document.getElementById("vlist").addEventListener("click", () => setView("list"));
document.getElementById("vrel").addEventListener("click", () => setView("releases"));
document.getElementById("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(applySearch, 250); });
// The address can pick the view (#board, #list, #releases) and the Flow
// panel mode (#board,chart), so a view can be bookmarked or linked.
{
  const want = location.hash.slice(1).split(",");
  if (want.includes("chart") || want.includes("table")) statsMode = want.includes("chart") ? "chart" : "table";
  let v = ["board", "list", "releases"].find(x => want.includes(x));
  if (!v) { try { v = localStorage.getItem("ait-view"); } catch (e) { /* private mode */ } }
  if (v === "list" || v === "releases") setView(v);
}
if (WRITABLE) {
  const nb = document.getElementById("newbtn");
  nb.hidden = false;
  nb.addEventListener("click", newDialog);
}
poll();
</script>
