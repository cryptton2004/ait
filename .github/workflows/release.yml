# Publishes a GitHub Release with the ait zip. Two ways to start it:
#   1. Actions tab -> Release -> "Run workflow" (on main). The release is
#      named after the version in Cargo.toml (v0.1.0) and the tag is created
#      on the commit that was built.
#   2. Push a version tag yourself: git tag v0.1.0 && git push origin v0.1.0
#      (the tag must match the version in Cargo.toml).
# A version can be released once: bump `version` in Cargo.toml for the next.
# Users download the zip from the repository's "Releases" page
# (…/releases/latest always points at the newest one).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $want" >&2
            exit 1
          fi
          if gh release view "$want" > /dev/null 2>&1; then
            echo "Release $want already exists: bump version in Cargo.toml first" >&2
            exit 1
          fi
          echo "VERSION=$want" >> "$GITHUB_ENV"

      - name: Quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name="ait-$VERSION-windows-x64"
          # Same layout as the repository, so the links between the docs work.
          mkdir -p "dist/$name/docs" "dist/$name/examples" "dist/$name/scripts"
          cp target/release/ait.exe default.cfg approvals.example.json \
             README.md INSTALL.md LICENSE "dist/$name/"
          cp docs/COMMANDS.md docs/API.md "dist/$name/docs/"
          cp examples/demo.jsonl "dist/$name/examples/"
          cp scripts/make-cert.ps1 scripts/make-cert.sh "dist/$name/scripts/"
          cd dist
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target creates the tag on the built commit when it does not exist yet.
          gh release create "$VERSION" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --title "ait $VERSION" --generate-notes
