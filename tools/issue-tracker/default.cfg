# ait configuration: plain `key = value`, `#` starts a comment.
# Relative paths are relative to this file's folder.
# ait reads this file when it sits next to ait.exe (or via --config / AIT_CONFIG).

# Database file. `auto` = <git-common-dir>/ait/tracker.db of the repository
# you run ait in, shared by all its worktrees and never committed.
db = auto

# Allowed id prefixes (comma separated). Empty = any 2-5 capital letters.
prefixes =

# Claim lease length in minutes. Any ait call by the claimant renews it.
lease_minutes = 60

# Daily automatic backups (VACUUM INTO). `auto` = a `backups` folder next to
# the database. backup_keep = 0 turns automatic backups off.
backup_dir = auto
backup_keep = 14

# Owner-only approvals file. If the file does not exist, approvals are not
# used and every ready issue can be claimed. See approvals.example.json.
approvals = approvals.json

# Port for `ait serve` (always bound to 127.0.0.1).
port = 7777

# Used by `ait check --git`: completed work is merged into this branch with a
# commit trailer such as `Issue-ID: CORE-1-00`.
main_branch = main
trailer = Issue-ID
