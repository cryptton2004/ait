# Publishes a GitHub Release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in Cargo.toml.
# Users then download the zip from the repository's "Releases" page
# (…/releases/latest always points at the newest one).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Tag matches the crate version
        run: |
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $want" >&2
            exit 1
          fi

      - name: Quality gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name="ait-$GITHUB_REF_NAME-windows-x64"
          # Same layout as the repository, so the links between the docs work.
          mkdir -p "dist/$name/docs" "dist/$name/examples"
          cp target/release/ait.exe default.cfg approvals.example.json \
             README.md INSTALL.md LICENSE "dist/$name/"
          cp docs/COMMANDS.md docs/API.md "dist/$name/docs/"
          cp examples/demo.jsonl "dist/$name/examples/"
          cd dist
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "ait $GITHUB_REF_NAME" --generate-notes
